apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-gateway
  namespace: pix-microservices
  annotations:
    # ALB Configuration
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    
    # Health Check
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: '15'
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: '5'
    alb.ingress.kubernetes.io/healthy-threshold-count: '2'
    alb.ingress.kubernetes.io/unhealthy-threshold-count: '2'
    
    # CORS (if needed)
    alb.ingress.kubernetes.io/actions.ssl-redirect: |
      {
        "Type": "redirect",
        "RedirectConfig": {
          "Protocol": "HTTPS",
          "Port": "443",
          "StatusCode": "HTTP_301"
        }
      }
    
    # Tags
    alb.ingress.kubernetes.io/tags: Environment=dev,Project=pix-banking-system

spec:
  ingressClassName: alb
  rules:
  - http:
      paths:
      # Auth Service Routes
      - path: /api/auth/register
        pathType: Prefix
        backend:
          service:
            name: auth-service
            port:
              number: 3000
      
      - path: /api/auth/login
        pathType: Prefix
        backend:
          service:
            name: auth-service
            port:
              number: 3000
      
      - path: /api/auth/*
        pathType: Prefix
        backend:
          service:
            name: auth-service
            port:
              number: 3000
      
      # Transaction Service Routes
      - path: /api/transactions
        pathType: Prefix
        backend:
          service:
            name: transaction-service
            port:
              number: 3000
      
      - path: /api/pix
        pathType: Prefix
        backend:
          service:
            name: transaction-service
            port:
              number: 3000
      
      # Settlement Service Routes
      - path: /api/settlement
        pathType: Prefix
        backend:
          service:
            name: settlement-service
            port:
              number: 3000
      
      # Frontend (NextJS)
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 3000