apiVersion: apps/v1
kind: Deployment
metadata:
  name: settlement-service
  namespace: pix-microservices
  labels:
    app: settlement-service
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: settlement-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: settlement-service
        version: v1
    spec:
      serviceAccountName: settlement-service
      containers:
      - name: settlement-service
        image: 347277718217.dkr.ecr.us-east-1.amazonaws.com/pix-banking-system-dev-settlement-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: http
          protocol: TCP
        
        env:
        # Application Config
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3000"
        - name: SERVICE_NAME
          value: "settlement-service"
        
        # AWS Config
        - name: AWS_REGION
          value: "us-east-1"
        
        # DynamoDB Tables
        - name: DYNAMODB_TRANSACTIONS_TABLE
          valueFrom:
            configMapKeyRef:
              name: dynamodb-config
              key: transactions_table
        - name: DYNAMODB_ACCOUNTS_TABLE
          valueFrom:
            configMapKeyRef:
              name: dynamodb-config
              key: accounts_table
        - name: DYNAMODB_NOTIFICATIONS_TABLE
          valueFrom:
            configMapKeyRef:
              name: dynamodb-config
              key: notifications_table
        
        # SQS Config
        - name: SQS_QUEUE_URL
          valueFrom:
            configMapKeyRef:
              name: sqs-config
              key: queue_url
        
        # SNS Config
        - name: SNS_TOPIC_ARN
          valueFrom:
            configMapKeyRef:
              name: sns-config
              key: topic_arn
        
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3